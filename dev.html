<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>0xVisual — Developer Panel</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
        --bg: #050505; --bg-2: #0a0a0a; --red: #ff2d2d; --red-dim: #cc1f1f;
        --text: #ffffff; --text-dim: #888888; --text-dimmer: #555555;
        --border: #1a1a1a; --border-red: rgba(255,45,45,0.3);
        --gold: #ffcc00; --green: #3bff5c;
    }
    html { scroll-behavior: smooth; }
    body {
        background: var(--bg); color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.6; min-height: 100vh;
        padding: 100px 40px 40px;
    }
    body::before {
        content: ''; position: fixed; inset: 0;
        background-image: linear-gradient(rgba(255,45,45,0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,45,45,0.03) 1px, transparent 1px);
        background-size: 60px 60px; pointer-events: none; z-index: 0;
    }
    nav {
        position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
        padding: 12px 24px; display: flex; justify-content: space-between;
        align-items: center; gap: 40px; background: rgba(10,10,10,0.8);
        backdrop-filter: blur(20px); border: 1px solid var(--border);
        border-radius: 100px; z-index: 100;
    }
    .logo { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 900; font-family: 'Courier New', monospace; }
    .logo-icon {
        width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, var(--red) 0%, var(--red-dim) 100%);
        border-radius: 6px; font-family: monospace; font-weight: 900; font-size: 14px;
        color: #fff; box-shadow: 0 0 15px rgba(255,45,45,0.4);
    }
    .nav-right { display: flex; align-items: center; gap: 12px; }
    .btn-nav {
        padding: 8px 18px; background: transparent; border: 1px solid var(--border-red);
        color: var(--red); border-radius: 100px; font-size: 11px; font-weight: 700;
        text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
        transition: all 0.3s ease; text-decoration: none;
    }
    .btn-nav:hover { background: var(--red); color: #fff; }
    .btn-nav.logout { border-color: #555; color: #888; }
    .btn-nav.logout:hover { border-color: var(--red); color: var(--red); background: transparent; }

    h1 { font-size: 48px; font-weight: 900; letter-spacing: -2px; margin-bottom: 8px; text-transform: uppercase; position: relative; z-index: 1; }
    .subtitle { color: var(--text-dim); margin-bottom: 40px; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; position: relative; z-index: 1; }

    .stats {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px; margin-bottom: 40px; position: relative; z-index: 1;
    }
    .stat-card {
        background: var(--bg-2); border: 1px solid var(--border);
        border-radius: 12px; padding: 24px;
    }
    .stat-value { font-size: 32px; font-weight: 900; color: var(--red); }
    .stat-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1.5px; margin-top: 4px; }

    .users-table {
        background: var(--bg-2); border: 1px solid var(--border);
        border-radius: 12px; overflow: hidden; position: relative; z-index: 1;
    }
    table { width: 100%; border-collapse: collapse; }
    th {
        background: #0f0f0f; padding: 14px 16px; text-align: left;
        font-size: 11px; color: var(--text-dim); text-transform: uppercase;
        letter-spacing: 1.5px; border-bottom: 1px solid var(--border);
    }
    td { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 14px; }
    tr:last-child td { border-bottom: none; }
    tr:hover { background: rgba(255,45,45,0.03); }

    .user-id {
        font-family: 'Courier New', monospace; color: var(--red);
        font-weight: 700; font-size: 13px;
    }
    .badge {
        display: inline-block; padding: 3px 10px; border-radius: 100px;
        font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
    }
    .badge-premium { background: rgba(255,204,0,0.15); color: var(--gold); border: 1px solid rgba(255,204,0,0.3); }
    .badge-free { background: rgba(136,136,136,0.15); color: var(--text-dim); border: 1px solid var(--border); }
    .badge-dev { background: rgba(255,45,45,0.15); color: var(--red); border: 1px solid var(--border-red); }

    .btn-action {
        padding: 6px 12px; background: transparent; border: 1px solid var(--border);
        color: var(--text-dim); border-radius: 6px; font-size: 11px;
        font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
        cursor: pointer; transition: all 0.3s ease; margin-right: 4px;
        font-family: inherit;
    }
    .btn-action:hover { border-color: var(--red); color: var(--red); }
    .btn-action.gold:hover { border-color: var(--gold); color: var(--gold); }

    .modal {
        display: none; position: fixed; inset: 0;
        background: rgba(0,0,0,0.8); z-index: 1000;
        align-items: center; justify-content: center;
    }
    .modal.visible { display: flex; }
    .modal-content {
        background: var(--bg-2); border: 1px solid var(--border-red);
        border-radius: 16px; padding: 32px; max-width: 400px; width: 90%;
        box-shadow: 0 0 40px rgba(255,45,45,0.15);
    }
    .modal-title { font-size: 20px; font-weight: 800; margin-bottom: 20px; }
    .modal-input {
        width: 100%; padding: 12px 16px; background: #0a0a0a;
        border: 1px solid var(--border); border-radius: 8px; color: #fff;
        font-size: 14px; margin-bottom: 12px; outline: none;
        font-family: inherit;
    }
    .modal-input:focus { border-color: var(--red); }
    .modal-buttons { display: flex; gap: 8px; }
    .modal-btn {
        flex: 1; padding: 12px; border-radius: 8px; font-size: 13px;
        font-weight: 700; text-transform: uppercase; cursor: pointer;
        transition: all 0.3s ease; font-family: inherit;
        letter-spacing: 1px;
    }
    .modal-btn-primary { background: var(--red); border: none; color: #fff; }
    .modal-btn-primary:hover { background: #ff4444; }
    .modal-btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
    .modal-btn-secondary:hover { border-color: #666; color: #fff; }

    .loading { text-align: center; padding: 60px; color: var(--text-dim); }
    .error { color: var(--red); text-align: center; padding: 40px; }
    .error a { color: var(--red); }

    @media (max-width: 900px) {
        body { padding: 100px 16px 40px; }
        h1 { font-size: 32px; }
        table { font-size: 12px; }
        th, td { padding: 10px 8px; }
    }
</style>
</head>
<body>

<nav>
    <div class="logo"><div class="logo-icon">0x</div><span>DEV PANEL</span></div>
    <div class="nav-right">
        <a href="index.html" class="btn-nav">На сайт</a>
        <a href="#" class="btn-nav logout" id="logoutBtn">Выйти</a>
    </div>
</nav>

<h1>Developer Panel</h1>
<div class="subtitle">Управление пользователями и подписками</div>

<div class="stats" id="stats">
    <div class="stat-card">
        <div class="stat-value" id="statTotal">—</div>
        <div class="stat-label">Всего игроков</div>
    </div>
    <div class="stat-card">
        <div class="stat-value" id="statPremium">—</div>
        <div class="stat-label">Premium активных</div>
    </div>
    <div class="stat-card">
        <div class="stat-value" id="statExpiring">—</div>
        <div class="stat-label">Истекает сегодня</div>
    </div>
    <div class="stat-card">
        <div class="stat-value" id="statDevs">—</div>
        <div class="stat-label">Разработчиков</div>
    </div>
</div>

<div class="users-table" id="tableContainer">
    <div class="loading">Загрузка...</div>
</div>

<div class="modal" id="premiumModal">
    <div class="modal-content">
        <div class="modal-title">Выдать Premium</div>
        <div style="font-size:13px; color:#888; margin-bottom:16px;">
            Игрок: <span id="modalUser" style="color:#ff2d2d; font-weight:700;"></span>
        </div>
        <input type="number" class="modal-input" id="premiumDays" placeholder="Количество дней" min="1" value="30">
        <div class="modal-buttons">
            <button class="modal-btn modal-btn-secondary" onclick="closeModal()">Отмена</button>
            <button class="modal-btn modal-btn-primary" onclick="grantPremium()">Выдать</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://brdkzffitlvfpesqtlth.supabase.co';
    const SUPABASE_ANON = 'sb_publishable_t1edVLpfw8Ez8MplA7ZPMw_oWp4tKSI';

    let currentUser = null;
    let selectedUserId = null;

    async function checkDev() {
        const userId = localStorage.getItem('0xvisual_id');

        if (!userId) {
            document.getElementById('tableContainer').innerHTML =
                '<div class="error">Не авторизован. Войди на <a href="index.html">главной</a>.</div>';
            return;
        }

        currentUser = { userId: parseInt(userId) };

        try {
            const res = await fetch(SUPABASE_URL + '/rest/v1/developers?user_id=eq.' + userId + '&select=user_id', {
                headers: { 'apikey': SUPABASE_ANON }
            });
            const data = await res.json();

            if (!Array.isArray(data) || data.length === 0) {
                document.getElementById('tableContainer').innerHTML =
                    '<div class="error">Доступ запрещён. Ты не разработчик.</div>';
                return;
            }

            loadUsers();
        } catch (e) {
            document.getElementById('tableContainer').innerHTML =
                '<div class="error">Ошибка проверки: ' + e.message + '</div>';
        }
    }

    async function loadUsers() {
        try {
            const [usersRes, premiumRes, devsRes] = await Promise.all([
                fetch(SUPABASE_URL + '/rest/v1/users?select=id,github_login,avatar_url,created_at&order=id', {
                    headers: { 'apikey': SUPABASE_ANON }
                }),
                fetch(SUPABASE_URL + '/rest/v1/premium?select=user_id,expires_at', {
                    headers: { 'apikey': SUPABASE_ANON }
                }),
                fetch(SUPABASE_URL + '/rest/v1/developers?select=user_id', {
                    headers: { 'apikey': SUPABASE_ANON }
                })
            ]);

            const users = await usersRes.json();
            const premium = await premiumRes.json();
            const devs = await devsRes.json();

            if (!Array.isArray(users)) {
                document.getElementById('tableContainer').innerHTML =
                    '<div class="error">Ошибка загрузки users: ' + JSON.stringify(users) + '</div>';
                return;
            }

            renderStats(users, premium, devs);
            renderTable(users, premium, devs);
        } catch (e) {
            document.getElementById('tableContainer').innerHTML =
                '<div class="error">Ошибка загрузки: ' + e.message + '</div>';
        }
    }

    function renderStats(users, premium, devs) {
        document.getElementById('statTotal').textContent = users.length || 0;
        document.getElementById('statDevs').textContent = (devs && devs.length) || 0;

        const now = new Date();
        const tomorrow = new Date(now.getTime() + 24 * 60 * 60 * 1000);

        const activePremium = (premium || []).filter(p => new Date(p.expires_at) > now).length;
        const expiring = (premium || []).filter(p => {
            const d = new Date(p.expires_at);
            return d > now && d < tomorrow;
        }).length;

        document.getElementById('statPremium').textContent = activePremium;
        document.getElementById('statExpiring').textContent = expiring;
    }

    function renderTable(users, premium, devs) {
        const now = new Date();
        const devIds = (devs || []).map(d => d.user_id);

        let html = '<table><thead><tr>' +
            '<th>ID</th><th>Ник</th><th>Статус</th><th>Premium до</th><th>Действия</th>' +
            '</tr></thead><tbody>';

        for (const u of users) {
            const prem = (premium || []).find(x => x.user_id === u.id);
            const isDev = devIds.includes(u.id);
            const isPremium = prem && new Date(prem.expires_at) > now;

            let statusBadge = isDev ? '<span class="badge badge-dev">DEV</span>' :
                             (isPremium ? '<span class="badge badge-premium">PREMIUM</span>' :
                                         '<span class="badge badge-free">FREE</span>');

            let premiumUntil = prem ? new Date(prem.expires_at).toLocaleDateString('ru-RU') : '—';
            if (isPremium) premiumUntil = '<span style="color:#ffcc00;">' + premiumUntil + '</span>';

            const safeLogin = (u.github_login || 'unknown').replace(/'/g, '');

            html += '<tr>' +
                '<td class="user-id">#' + u.id + '</td>' +
                '<td>@' + safeLogin + '</td>' +
                '<td>' + statusBadge + '</td>' +
                '<td>' + premiumUntil + '</td>' +
                '<td>' +
                    '<button class="btn-action gold" onclick="openPremiumModal(' + u.id + ', \'' + safeLogin + '\')">+ Premium</button>' +
                    (isPremium ? '<button class="btn-action" onclick="revokePremium(' + u.id + ')">Отозвать</button>' : '') +
                '</td>' +
            '</tr>';
        }

        html += '</tbody></table>';
        document.getElementById('tableContainer').innerHTML = html;
    }

    function openPremiumModal(userId, username) {
        selectedUserId = userId;
        document.getElementById('modalUser').textContent = '@' + username;
        document.getElementById('premiumDays').value = 30;
        document.getElementById('premiumModal').classList.add('visible');
    }

    function closeModal() {
        document.getElementById('premiumModal').classList.remove('visible');
        selectedUserId = null;
    }

    async function grantPremium() {
        const days = parseInt(document.getElementById('premiumDays').value);
        if (!days || days < 1) {
            alert('Введи корректное количество дней');
            return;
        }

        const expiresAt = new Date();
        expiresAt.setDate(expiresAt.getDate() + days);

        try {
            const res = await fetch(SUPABASE_URL + '/rest/v1/premium', {
                method: 'POST',
                headers: {
                    'apikey': SUPABASE_ANON,
                    'Content-Type': 'application/json',
                    'Prefer': 'resolution=merge-duplicates'
                },
                body: JSON.stringify({
                    user_id: selectedUserId,
                    expires_at: expiresAt.toISOString(),
                    issued_by: currentUser.userId
                })
            });

            if (res.ok) {
                closeModal();
                loadUsers();
            } else {
                const err = await res.text();
                alert('Ошибка: ' + err);
            }
        } catch (e) {
            alert('Ошибка: ' + e.message);
        }
    }

    async function revokePremium(userId) {
        if (!confirm('Отозвать Premium?')) return;

        try {
            const res = await fetch(SUPABASE_URL + '/rest/v1/premium?user_id=eq.' + userId, {
                method: 'DELETE',
                headers: { 'apikey': SUPABASE_ANON }
            });

            if (res.ok) loadUsers();
            else alert('Ошибка удаления');
        } catch (e) {
            alert('Ошибка: ' + e.message);
        }
    }

    document.getElementById('logoutBtn').addEventListener('click', function(e) {
        e.preventDefault();
        localStorage.clear();
        window.location.href = 'index.html';
    });

    checkDev();
</script>

</body>
</html>
